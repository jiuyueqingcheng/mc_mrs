name: Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

env:
  MIHOMO_VERSION: 1.19.3
  TOOLS_DIR: data/tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tools dir
        run: mkdir -p ${{ env.TOOLS_DIR }}

      - name: Install mihomo
        run: |
          cd ${{ env.TOOLS_DIR }}
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          gzip -d mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }}.gz
          mv mihomo-linux-amd64-v${{ env.MIHOMO_VERSION }} mihomo
          chmod +x mihomo

      # 🔥 全局遍历：所有目录、所有子文件夹的 .txt → .mrs
      - name: Convert ALL txt to mrs
        run: |
          find . -type f -name "*.txt" | while read txt; do
            out="${txt%.txt}.mrs"
            ${{ env.TOOLS_DIR }}/mihomo convert-ruleset domain text "$txt" "$out"
            echo "✅ 转换：$txt → $out"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto convert all txt to mrs"
          git push
